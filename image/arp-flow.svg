<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="280" rx="12" fill="#fafafa"/>
  <rect width="860" height="280" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">ARP：已知 IP，求同一局域网 MAC</text>

  <rect x="40" y="60" width="160" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0"/><text x="120" y="90" text-anchor="middle" font-size="13" fill="#0d47a1">主机 A</text><text x="120" y="112" text-anchor="middle" font-size="11" fill="#1565c0">10.0.0.2</text>
  <rect x="350" y="60" width="160" height="70" rx="8" fill="#fff3e0" stroke="#e65100"/><text x="430" y="90" text-anchor="middle" font-size="13" fill="#bf360c">交换机</text><text x="430" y="112" text-anchor="middle" font-size="11" fill="#e65100">二层转发</text>
  <rect x="660" y="60" width="160" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32"/><text x="740" y="90" text-anchor="middle" font-size="13" fill="#1b5e20">主机 B</text><text x="740" y="112" text-anchor="middle" font-size="11" fill="#2e7d32">10.0.0.3</text>
  <line x1="200" y1="160" x2="660" y2="160" stroke="#c62828" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="430" y="154" text-anchor="middle" font-size="12" fill="#c62828">广播 ARP Request：谁是 10.0.0.3？告诉 10.0.0.2</text>
  <line x1="660" y1="200" x2="200" y2="200" stroke="#2e7d32" stroke-width="2"/>
  <polygon points="200,200 214,194 214,206" fill="#2e7d32"/>
  <text x="430" y="228" text-anchor="middle" font-size="12" fill="#2e7d32">单播 ARP Reply：我是，MAC=bb:bb:…</text>
  <text x="430" y="260" text-anchor="middle" font-size="11" fill="#78909c">结果写入 ARP 缓存。跨网段不走 ARP，走默认网关，MAC 是路由器接口</text>

</svg>
