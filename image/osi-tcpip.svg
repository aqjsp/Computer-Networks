<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="420" rx="12" fill="#fafafa"/>
  <rect width="900" height="420" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">OSI 七层 vs TCP/IP 四层</text>

  <rect x="40" y="58" width="240" height="330" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">OSI 七层（理论）</text>
  <rect x="60" y="98" width="200" height="36" rx="6" fill="#bbdefb" stroke="#1565c0"/><text x="160" y="122" text-anchor="middle" font-size="13" fill="#0d47a1">应用层 HTTP/DNS/SMTP</text>
  <rect x="60" y="140" width="200" height="36" rx="6" fill="#bbdefb" stroke="#1565c0"/><text x="160" y="164" text-anchor="middle" font-size="13" fill="#0d47a1">表示层 编码/加密/压缩</text>
  <rect x="60" y="182" width="200" height="36" rx="6" fill="#bbdefb" stroke="#1565c0"/><text x="160" y="206" text-anchor="middle" font-size="13" fill="#0d47a1">会话层 会话建立/维持</text>
  <rect x="60" y="224" width="200" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/><text x="160" y="248" text-anchor="middle" font-size="13" fill="#1b5e20">传输层 TCP / UDP</text>
  <rect x="60" y="266" width="200" height="36" rx="6" fill="#ffe0b2" stroke="#e65100"/><text x="160" y="290" text-anchor="middle" font-size="13" fill="#bf360c">网络层 IP / ICMP / OSPF</text>
  <rect x="60" y="308" width="200" height="36" rx="6" fill="#f8bbd0" stroke="#c2185b"/><text x="160" y="332" text-anchor="middle" font-size="13" fill="#880e4f">数据链路层 以太网帧</text>
  <rect x="60" y="350" width="200" height="24" rx="6" fill="#eceff1" stroke="#607d8b"/><text x="160" y="367" text-anchor="middle" font-size="12" fill="#37474f">物理层 比特流</text>

  <rect x="360" y="58" width="240" height="330" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="480" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#f57f17">TCP/IP 四层（实际）</text>
  <rect x="380" y="98" width="200" height="120" rx="6" fill="#bbdefb" stroke="#1565c0"/><text x="480" y="154" text-anchor="middle" font-size="13" fill="#0d47a1">应用层</text><text x="480" y="176" text-anchor="middle" font-size="11" fill="#1565c0">HTTP · DNS · TLS</text>
  <rect x="380" y="224" width="200" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/><text x="480" y="248" text-anchor="middle" font-size="13" fill="#1b5e20">传输层 TCP / UDP</text>
  <rect x="380" y="266" width="200" height="36" rx="6" fill="#ffe0b2" stroke="#e65100"/><text x="480" y="290" text-anchor="middle" font-size="13" fill="#bf360c">网际层 IP / ICMP</text>
  <rect x="380" y="308" width="200" height="66" rx="6" fill="#f8bbd0" stroke="#c2185b"/><text x="480" y="338" text-anchor="middle" font-size="13" fill="#880e4f">网络接口层</text><text x="480" y="358" text-anchor="middle" font-size="11" fill="#ad1457">以太网 · Wi-Fi · ARP</text>

  <rect x="640" y="58" width="220" height="330" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="750" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">封装方向 ↓</text>
  <text x="750" y="130" text-anchor="middle" font-size="12" fill="#4a148c">数据</text>
  <text x="750" y="168" text-anchor="middle" font-size="12" fill="#4a148c">+ TCP/UDP 首部</text>
  <text x="750" y="206" text-anchor="middle" font-size="12" fill="#4a148c">+ IP 首部</text>
  <text x="750" y="248" text-anchor="middle" font-size="12" fill="#4a148c">+ 帧头/帧尾</text>
  <text x="750" y="290" text-anchor="middle" font-size="12" fill="#4a148c">比特流上线路</text>
  <text x="750" y="350" text-anchor="middle" font-size="11" fill="#7b1fa2">对端反向拆封</text>

</svg>
