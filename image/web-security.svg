<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="330" rx="12" fill="#fafafa"/>
  <rect width="900" height="330" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">四类 Web 攻击与对应防御：数据别当代码，请求别当本人</text>

  <rect x="30" y="52" width="205" height="150" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="132" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">XSS</text>
  <text x="132" y="100" text-anchor="middle" font-size="11" fill="#37474f">在你站点执行</text>
  <text x="132" y="118" text-anchor="middle" font-size="11" fill="#37474f">攻击者脚本</text>
  <text x="132" y="140" text-anchor="middle" font-size="11" fill="#b71c1c">（代码信任问题）</text>
  <text x="132" y="166" text-anchor="middle" font-size="11" fill="#2e7d32">输出转义 + CSP</text>
  <text x="132" y="184" text-anchor="middle" font-size="11" fill="#2e7d32">Cookie HttpOnly</text>

  <rect x="245" y="52" width="205" height="150" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="347" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">CSRF</text>
  <text x="347" y="100" text-anchor="middle" font-size="11" fill="#37474f">冒用你的登录态</text>
  <text x="347" y="118" text-anchor="middle" font-size="11" fill="#37474f">替你发请求</text>
  <text x="347" y="140" text-anchor="middle" font-size="11" fill="#bf360c">（身份信任问题）</text>
  <text x="347" y="166" text-anchor="middle" font-size="11" fill="#2e7d32">CSRF Token</text>
  <text x="347" y="184" text-anchor="middle" font-size="11" fill="#2e7d32">SameSite Cookie</text>

  <rect x="460" y="52" width="205" height="150" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="562" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">SQL / 命令注入</text>
  <text x="562" y="100" text-anchor="middle" font-size="11" fill="#37474f">把输入拼进</text>
  <text x="562" y="118" text-anchor="middle" font-size="11" fill="#37474f">会被执行的串</text>
  <text x="562" y="140" text-anchor="middle" font-size="11" fill="#0d47a1">（数据当代码）</text>
  <text x="562" y="166" text-anchor="middle" font-size="11" fill="#2e7d32">参数化查询</text>
  <text x="562" y="184" text-anchor="middle" font-size="11" fill="#2e7d32">最小权限</text>

  <rect x="675" y="52" width="195" height="150" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="772" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a1b9a">同源策略 / CORS</text>
  <text x="772" y="100" text-anchor="middle" font-size="11" fill="#37474f">SOP：拦 JS 读</text>
  <text x="772" y="118" text-anchor="middle" font-size="11" fill="#37474f">跨源响应/DOM</text>
  <text x="772" y="140" text-anchor="middle" font-size="11" fill="#4a148c">不拦请求发出</text>
  <text x="772" y="166" text-anchor="middle" font-size="11" fill="#37474f">CORS = 服务器授权</text>
  <text x="772" y="184" text-anchor="middle" font-size="11" fill="#37474f">放开、浏览器执行</text>

  <text x="450" y="240" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">共性：把不可信输入当代码解释执行（HTML / SQL / shell）</text>
  <text x="450" y="266" text-anchor="middle" font-size="12" fill="#455a64">统一防线：数据与代码分离 —— 转义、参数化、白名单、最小权限</text>
  <text x="450" y="298" text-anchor="middle" font-size="11" fill="#78909c">TLS 只保证传输不被窃听篡改；应用层安全要另做</text>
</svg>
