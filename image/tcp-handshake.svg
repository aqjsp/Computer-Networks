<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="380" rx="12" fill="#fafafa"/>
  <rect width="860" height="380" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">TCP 三次握手</text>

  <text x="140" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">客户端</text>
  <text x="720" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">服务端</text>
  <line x1="140" y1="88" x2="140" y2="350" stroke="#90caf9" stroke-width="2"/>
  <line x1="720" y1="88" x2="720" y2="350" stroke="#ffcc80" stroke-width="2"/>
  <text x="140" y="108" text-anchor="middle" font-size="11" fill="#546e7a">CLOSED → SYN_SENT</text>
  <text x="720" y="108" text-anchor="middle" font-size="11" fill="#546e7a">LISTEN</text>
  <line x1="140" y1="140" x2="720" y2="170" stroke="#1565c0" stroke-width="2"/>
  <polygon points="720,170 706,164 706,176" fill="#1565c0"/>
  <text x="430" y="148" text-anchor="middle" font-size="12" fill="#1565c0">① SYN seq=x</text>
  <line x1="720" y1="200" x2="140" y2="230" stroke="#e65100" stroke-width="2"/>
  <polygon points="140,230 154,224 154,236" fill="#e65100"/>
  <text x="430" y="208" text-anchor="middle" font-size="12" fill="#e65100">② SYN+ACK seq=y ack=x+1</text>
  <text x="720" y="194" text-anchor="start" font-size="11" fill="#546e7a"> SYN_RCVD</text>
  <line x1="140" y1="260" x2="720" y2="290" stroke="#2e7d32" stroke-width="2"/>
  <polygon points="720,290 706,284 706,296" fill="#2e7d32"/>
  <text x="430" y="268" text-anchor="middle" font-size="12" fill="#2e7d32">③ ACK ack=y+1（可带数据）</text>
  <text x="140" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">ESTABLISHED</text>
  <text x="720" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">ESTABLISHED</text>
  <text x="430" y="368" text-anchor="middle" font-size="11" fill="#78909c">第三次握手才允许携带应用数据，避免 SYN 洪水把数据灌进半连接队列</text>

</svg>
